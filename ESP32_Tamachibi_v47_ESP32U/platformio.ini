[platformio]
src_dir = .

[env:esp32u]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

lib_deps =
  adafruit/Adafruit SH110X@2.1.15
  adafruit/Adafruit SSD1306@2.5.17
  adafruit/Adafruit GFX Library@1.13.0
  adafruit/Adafruit BusIO@1.17.4
  earlephilhower/ESP8266Audio@2.4.1
  pschatzmann/ESP32-A2DP@1.8.11

build_flags =
  -DCORE_DEBUG_LEVEL=0

