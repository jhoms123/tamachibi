[platformio]
src_dir = .

[env:esp32u]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

lib_deps =
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
  adafruit/Adafruit BusIO
  adafruit/Adafruit VS1053 Library

build_flags =
  -DCORE_DEBUG_LEVEL=0
